name: PHP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: advancedbroker_test
          MYSQL_USER: advancedbroker
          MYSQL_PASSWORD: advancedbroker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, gd, intl
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install production dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          APP_NAME="Upgraded Broker CI"
          APP_ENV=testing
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8000
          APP_KEY=ci-only-9e46f841696b4d96972f3a7595189e88c8846d05de78089553572e342b66b16e
          APP_TIMEZONE=UTC
          SESSION_NAME=advancedbroker_ci
          SESSION_LIFETIME=7200
          SESSION_SECURE_COOKIE=false
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=advancedbroker_test
          DB_USERNAME=advancedbroker
          DB_PASSWORD=advancedbroker
          MAIL_DRIVER=log
          MAIL_HOST=
          MAIL_PORT=587
          MAIL_USERNAME=
          MAIL_PASSWORD=
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=ci@example.test
          MAIL_FROM_NAME="Advancedbroker CI"
          SUPER_ADMIN_EMAIL=admin@example.test
          SUPER_ADMIN_PASSWORD=CiOnly-StrongPassword-42
          SUPER_ADMIN_FIRST_NAME=CI
          SUPER_ADMIN_LAST_NAME=Administrator
          UPLOAD_MAX_BYTES=5242880
          RATE_LIMIT_PER_MINUTE=1000
          MAINTENANCE_MODE=false
          CACHE_ENABLED=false
          TRUSTED_PROXIES=
          GEOIP_DRIVER=maxmind
          GEOIP_DATABASE_PATH=
          TRUST_CLOUDFLARE_COUNTRY_HEADER=false
          EOF
          mkdir -p storage/cache storage/logs storage/private storage/uploads

      - name: Lint all PHP files
        run: |
          set -euo pipefail
          find app bin config database public resources routes tests -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Run unit/static-behavior tests
        run: php tests/run.php

      - name: Run database migrations
        run: php bin/migrate.php

      - name: Verify migration status
        run: |
          php bin/migrate.php status
          test "$(php bin/migrate.php status | grep -c '^\[down\]')" -eq 0

      - name: Run production-safe seeders
        run: php bin/seed.php

      - name: Verify catalogue seed counts
        run: php bin/verify-seed.php

      - name: Application boot smoke test
        run: php -r 'require "vendor/autoload.php"; require "app/Support/helpers.php"; \App\Application::boot(getcwd()); echo "Application boot passed\n";'

      - name: Run health check
        run: php bin/health.php

      - name: Run reconciliation
        run: php bin/reconcile-wallets.php

      - name: HTTP smoke test
        run: |
          php -S 127.0.0.1:8000 -t public > /tmp/advancedbroker-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:8000/login > /tmp/login.html
          curl --fail --silent --show-error http://127.0.0.1:8000/register > /tmp/register.html
          curl --fail --silent --show-error http://127.0.0.1:8000/companies > /tmp/companies.html
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
